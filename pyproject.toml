[project]
name = "rtty-soda"
version = "0.7.6"
description = "A PyNaCl frontend with custom encodings, compression, and key derivation"
readme = "README.md"
license = { text = "MIT" }

authors = [
    { name = "Theo Saveliev", email = "89431871+theosaveliev@users.noreply.github.com" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.15",
    "Operating System :: POSIX",
    "Environment :: Console",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]

keywords = ["cli", "encryption", "libsodium", "nacl"]

requires-python = ">=3.15,<4.0"

dependencies = [
    "brotli>=1.2.1,<2.0.0",
    "gmpy2>=2.3.2,<3.0.0",
    "pynacl>=1.6.2,<2.0.0",
    "pyotp>=2.12.1,<3.0.0",
    "scsu>=1.1.1,<2.0.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.5.1,<9.0.0",
    "click-aliases>=1.0.7,<2.0.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2,<2.0.0",
    "gmpy2-stubs>=2.2.1.5,<3.0.0.0",
    "jinja2-cli[toml]>=1.0.1,<2.0.0",
    "jinja2-shell-extension>=2.1.1,<3.0.0",
    "mypy>=2.4.1,<3.0.0",
    "poethepoet>=0.49.0,<0.50.0",
    "pytest>=9.2.0,<10.0.0",
    "ruff>=0.17.6,<0.18.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
soda = "rtty_soda.cli.main:cli"

[project.urls]
github = "https://github.com/theosaveliev/rtty-soda"
issues = "https://github.com/theosaveliev/rtty-soda/issues"

[tool.uv]
add-bounds = "major"

[tool.uv.build-backend]
source-exclude = [
    ".env",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
    ".DS_Store",
    ".idea",
    ".vscode",
]

wheel-exclude = [
    ".env",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
    ".DS_Store",
    ".idea",
    ".vscode",
]

[tool.poe.executor]
type = "uv"

[tool.poe.env]
PYTHON_GIL = "0"

[tool.poe.tasks]
format = "ruff format"
lint = "ruff check --fix ."
mypy = "mypy ."
pyright = "basedpyright ."
test = "pytest -m 'not slow'"
full-test = "pytest"
readme = "jinja2 --extension=jinja2_shell_extension.ShellExtension docs/README.j2 pyproject.toml --outfile README.md"
dev = ["format", "lint", "mypy", "pyright"]
pre-build = ["dev", "full-test", "readme"]

[tool.poe.tasks.docker]
shell = """
    IMAGE_TAG=nett/rtty-soda:$(uv version --short)
    PLATFORM=linux/amd64,linux/arm64/v8
    docker buildx build --tag ${IMAGE_TAG} --builder colima-multiarch --platform ${PLATFORM} --file docker/Dockerfile --no-cache --push docker
"""
